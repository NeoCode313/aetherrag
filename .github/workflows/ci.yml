name: verify
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_DB: aetherrag_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d aetherrag_test" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      CATALOG_TEST_DATABASE_URL: postgresql+psycopg://test:test_only@localhost:5432/aetherrag_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci --prefix frontend-react --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix frontend-react
      - name: Verify committed frontend matches its TypeScript source
        run: git diff --exit-code -- frontend/index.html frontend/app.js frontend/styles.css
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -B -m pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Pinned multilingual embeddings and safe index migration (no cloud inference)
        env:
          SEMANTIC_TEST_MODEL_DIR: .cache/e5-small
        run: |
          python -B backend/scripts/download_semantic_model.py --directory .cache/e5-small
          python -B -m pytest backend/tests/integration/test_semantic_retrieval.py -q -p no:cacheprovider
      - name: Synthetic facets and source locations (local provider)
        run: python -B backend/scripts/evaluate_rag_metrics.py --synthetic-demo --dataset backend/evaluation/synthetic_suite_v3.jsonl --output synthetic-results.json
      - name: Concurrent local integrity and latency budgets
        run: python -B backend/scripts/load_smoke.py --count 100 --output load-results.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: node --test frontend/tests/*.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-and-local-measurements
          path: |
            test-results.xml
            synthetic-results.json
            load-results.json

  compose-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Generate ephemeral test credentials
        env:
          CI_OPERATOR_PASSWORD: OnlyForThisEphemeralCIStack-48291
        run: python backend/scripts/setup_env.py --password-env CI_OPERATOR_PASSWORD
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Run real broker and vector-store integration
        env:
          STACK_TEST_PASSWORD: OnlyForThisEphemeralCIStack-48291
        run: docker compose --profile test run --rm integration-tests
      - if: failure()
        run: docker compose logs --no-color --tail 150 api worker migrate qdrant postgres
      - if: always()
        run: docker compose down --volumes
