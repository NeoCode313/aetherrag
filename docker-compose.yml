name: aetherrag

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: aetherrag-app:local
  env_file: ${AETHERRAG_ENV_FILE:-.env}
  environment: &app-environment
    ENVIRONMENT: production
    DATA_DIR: /workspace/data
    DATABASE_URL: postgresql+psycopg://aetherrag:${DB_PASSWORD:?Run backend/scripts/setup_env.py first}@postgres:5432/aetherrag
    QDRANT_URL: http://qdrant:6333
    QDRANT_API_KEY: ${QDRANT_API_KEY:?Run setup_env.py first}
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run setup_env.py first}@redis:6379/0
    QUEUE_BACKEND: celery
    STATE_BACKEND: postgres
    VECTOR_BACKEND: qdrant
    SESSION_SECRET: ${SESSION_SECRET:?Run setup_env.py first}
    OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:?Run setup_env.py first}
    AUTH_ENABLED: "true"
    SESSION_SECURE: "true"
    AUTO_SEED_SAMPLE_MANUAL: "false"
  volumes: [rag_data:/workspace/data]
  networks: [backend]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true

services:
  postgres:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: aetherrag
      POSTGRES_USER: aetherrag
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run setup_env.py first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-bookworm@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup_env.py first}
    command: [sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  qdrant:
    # Immutable multi-platform manifest; update deliberately with integration tests.
    image: qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run setup_env.py first}
    volumes: [qdrant_data:/qdrant/storage]
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ \"$$status\" == *\"200\"* ]]"
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    command: [python, backend/scripts/catalog_admin.py, migrate]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    <<: *app
    command: [celery, -A, app.infrastructure.tasks.queue_adapter:celery_app, worker, --loglevel=info, --concurrency=2, --prefetch-multiplier=1, --hostname=worker@%h]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    stop_grace_period: 40s
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    ports: ["127.0.0.1:${APP_HTTPS_PORT:-8443}:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend, backend]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The official binary has this file capability; keep it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --output, /dev/null, --cacert, /data/caddy/pki/authorities/local/root.crt, --max-time, "5", "https://localhost:8443/api/v1/system/health"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  integration-tests:
    <<: *app
    profiles: [test]
    environment:
      <<: *app-environment
      ENVIRONMENT: test
      CATALOG_TEST_DATABASE_URL: postgresql+psycopg://aetherrag:${DB_PASSWORD:?Run setup_env.py first}@postgres:5432/aetherrag
      STACK_TEST_URL: https://proxy:8443
      STACK_TEST_USERNAME: ${OPERATOR_USERNAME:-admin}
      STACK_TEST_PASSWORD: ${STACK_TEST_PASSWORD:-}
      PYTEST_ADDOPTS: -p no:cacheprovider
    command: [python, -B, -m, pytest, backend/tests/unit/test_catalog.py, backend/tests/integration/test_catalog_postgres.py, backend/tests/integration/test_real_stack.py, -q]
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
      proxy: {condition: service_healthy}
    restart: "no"

networks:
  frontend:
  backend:
    # No auxiliary ports are published; configured LLM APIs still need egress.

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rag_data:
  caddy_data:
  caddy_config:
